version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    groups:
      # Tightly coupled packages are upgraded together (including majors)
      tauri:
        patterns:
          - '@tauri-apps/*'
      vite:
        patterns:
          - 'vite'
          - 'vitest'
          - '@vitest/*'
          - '@vitejs/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'prettier-plugin-tailwindcss'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
      minor-and-patch:
        dependency-type: production
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: cargo
    directory: '/src-tauri'
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns:
          - 'tauri'
          - 'tauri-*'
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    groups:
      # Keep action major upgrades individually reviewable.
      github-actions:
        update-types:
          - minor
          - patch
        patterns:
          - '*'
      security:
        applies-to: security-updates
        patterns:
          - '*'
