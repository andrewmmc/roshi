name: Tag Release

# Tag-only release path. Kept separate from ci.yml so pull requests do not
# surface skipped release/appstore-upload checks on every PR.
on:
  push:
    tags:
      - 'v*'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test with coverage
        run: npm run test:coverage

      - name: Report coverage
        if: always()
        run: node scripts/report-coverage.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: Type check and build
        run: npm run build

      - name: Validate App Store release notes
        run: npm run validate:release-notes

  release:
    needs: ci
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  appstore-upload:
    needs:
      - ci
      - release
    # Never upload pre-releases (tags containing a hyphen, e.g. v1.1.0-beta) to
    # App Store Connect.
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/appstore.yml
    with:
      ref: ${{ github.ref_name }}
    secrets: inherit
