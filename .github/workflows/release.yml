name: Release

# Tag-only release path. Kept separate from ci.yml so pull requests do not
# surface skipped release/appstore-upload checks on every PR.
on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: Version tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test with coverage
        run: npm run test:coverage

      - name: Report coverage
        if: always()
        run: node scripts/report-coverage.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage

      - name: Run Playwright e2e tests
        uses: ./.github/actions/playwright-e2e

      - name: Type check and build
        run: npm run build

      - name: Validate App Store release notes
        run: npm run validate:release-notes

  build-tauri:
    needs: ci
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Set build env vars
        run: |
          echo "APP_VERSION=${RELEASE_TAG#v}" >> $GITHUB_ENV
          echo "APP_COMMIT=$(git rev-parse --short=9 HEAD)" >> $GITHUB_ENV

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${{ vars.APPLE_API_KEY }}.p8
          echo "API_KEY_PATH=$HOME/private_keys/AuthKey_${{ vars.APPLE_API_KEY }}.p8" >> $GITHUB_ENV

      - name: Build Tauri app (Developer ID signed + notarized)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
          VITE_APP_COMMIT: ${{ env.APP_COMMIT }}
          APPLE_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.DEVELOPER_ID_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.API_KEY_PATH }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_TAG }}
          releaseDraft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generateReleaseNotes: true
          args: ${{ matrix.args }}

  appstore-upload:
    needs:
      - ci
      - build-tauri
    # Never upload pre-releases (tags containing a hyphen, e.g. v1.1.0-beta) to
    # App Store Connect.
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    uses: ./.github/workflows/appstore.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
