[package]
name = "roshi"
version = "2.5.0"
description = "MIT-licensed local-first workbench for testing LLM APIs"
authors = ["Andrew MMC"]
license = "MIT"
edition = "2021"

[lib]
name = "roshi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri-plugin-http = "2.5.9"
tauri-plugin-opener = "2.7.0"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"

# Keep compile-time macros loadable on macOS 27 with affected Rust toolchains.
# https://github.com/rust-lang/rust/issues/157750
[profile.release.build-override]
strip = "none"
